abstract: >-
  Bhumbra and Beato (2013) introduced Bayesian Quantal Analysis (BQA), which infers the quantal parameters of synaptic transmission from recorded response amplitudes by evaluating the posterior on a fixed grid. We reimplemented BQA just using their paper, without reading or implementing the authors' code. The likelihood and grid inference were reproduced. Simulation-based calibration, which the original paper did not run, shows unbiased point estimates and calibrated total-response, variability and site-count marginals. The quantal-size interval is conservative, covering 94.5 percent at a nominal 90 percent, because of the sum over candidate site counts. A first version of this analysis reported the opposite, caused by an off-by-half-cell error in our own rank statistic, which we write about. We also map identifiability across the release-probability contrast, compare BQA with multiple-probability fluctuation analysis, and show that at low signal-to-noise a 27 percent quantal-size bias comes from Gaussian-versus-gamma misspecification amplified by weak signal.
